
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Table</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#090d19] text-white flex items-center justify-center p-5"
      style="font-family: 'Inter', sans-serif;">
    <div class="w-full max-w-5xl bg-[#111827] border border-white/10 rounded-2xl overflow-hidden shadow-2xl shadow-violet-950/20">
        <div class="px-7 py-5">
            <div class="flex items-center gap-3 bg-[#0b1220] border border-slate-700/60 rounded-xl px-4 h-12 focus-within:border-violet-500 transition">
                <span class="text-violet-400 text-xl">⌕</span>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search coin or ticker..."
                    class="w-full bg-transparent outline-none text-sm text-white placeholder:text-slate-500"
                >
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-center min-w-[600px] ">
                <thead class="bg-[#1a2235]">
                    <tr class="text-[11px] tracking-widest text-slate-400">
                        <th id="sortByName" class="px-7 py-5 cursor-pointer hover:text-violet-300 transition">
                            COIN <span class="text-violet-400">↕</span>
                        </th>
                        <th class="px-7 py-5">TICKER</th>
                        <th class="px-7 py-5">PRICE</th>
                        <th class="px-7 py-5">24H CHANGE</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-white/[0.06]">
                </tbody>
            </table>
        </div>
    <script src="script.js"></script>

</body>
</html>
